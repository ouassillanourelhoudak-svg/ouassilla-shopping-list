<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Checklist</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#1e1e1e;
    color:white;
    display:flex;
    justify-content:center;
    padding:40px;
}

.container{
    width:600px;
    background:#2b2b2b;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.4);
}

h1{
    text-align:center;
}

h2{
    text-align:center;
    color:#00d4ff;
}

.checklist{
    list-style:none;
    padding:0;
}

.checklist li{
    margin:15px 0;
    font-size:20px;
}

input[type="checkbox"]{
    transform:scale(1.4);
    margin-right:12px;
}

.done{
    text-decoration:line-through;
    color:gray;
}
</style>
</head>

<body>

<div class="container">
    <h1>Shopping Checklist</h1>
    <h2>Budget: €300</h2>

    <ul class="checklist">
        <li><label><input type="checkbox"> Jeans 👖 (White, 2 Jeans, 1 Weird Pants) (€30)</label></li>

        <li><label><input type="checkbox"> Sweaters (2 Big Sports Pants, 3 Sweaters) (€30)</label></li>

        <li><label><input type="checkbox"> Coats 🧥 (2 Different Colours) (€20)</label></li>

        <li><label><input type="checkbox"> Shoes 👟 & Boots 👢 (€50)</label></li>

        <li><label><input type="checkbox"> Shirts 👕 (4 Long Sleeve, 3 Short Sleeve) (€30)</label></li>

        <li><label><input type="checkbox"> Accessories (Earrings, Nails, Necklaces, Rings - Stainless Steel) (€20)</label></li>

        <li><label><input type="checkbox"> Makeup (Fit Me Concealer, Setting Spray, Eyeliner)</label></li>
    </ul>
</div>

<script>
const boxes = document.querySelectorAll("input[type='checkbox']");

boxes.forEach(box => {
    box.addEventListener("change", function(){
        if(this.checked){
            this.parentElement.classList.add("done");
        }else{
            this.parentElement.classList.remove("done");
        }
    });
});
</script>

</body>
</html>
